{% extends "base.html" %}

{% block title %}Citizen Registration | Village Digital Service System{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">📝</span>
            <h2>Citizen Registration</h2>
            <p>Create your citizen account to access digital village services and submit requests.</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="auth-form" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label for="full_name">Full Name <span class="required">*</span></label>
                    <input type="text" id="full_name" name="full_name" class="form-control" 
                           placeholder="Enter your full name" 
                           value="{{ request.form.get('full_name', '') }}" required autofocus>
                </div>

                <div class="form-group">
                    <label for="village_name">Village / Gram Panchayat <span class="required">*</span></label>
                    <input type="text" id="village_name" name="village_name" class="form-control" 
                           placeholder="e.g. Rampur, Shivpur" 
                           value="{{ request.form.get('village_name', '') }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" 
                           placeholder="name@example.com" 
                           value="{{ request.form.get('email', '') }}" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number (10 Digits) <span class="required">*</span></label>
                    <input type="tel" id="mobile" name="mobile" class="form-control" 
                           placeholder="9876543210" pattern="[0-9]{10}" maxlength="10"
                           value="{{ request.form.get('mobile', '') }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Residential Address / Ward No. <span class="required">*</span></label>
                <textarea id="address" name="address" rows="3" class="form-control" 
                          placeholder="House No, Ward No, Landmark, Village details" required>{{ request.form.get('address', '') }}</textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" class="form-control" 
                           placeholder="Minimum 6 characters" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password <span class="required">*</span></label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" 
                           placeholder="Re-enter password" minlength="6" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Register Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}">Sign In here</a></p>
        </div>
    </div>
</div>
{% endblock %}
